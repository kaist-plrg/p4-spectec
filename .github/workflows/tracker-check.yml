# Tracker checks: keep the kaist-plrg GitHub Projects (Mismatches,
# Soundness) in sync with their sources of truth. Negative-testgen is a
# frozen, curated set of external p4lang/p4c bugs, seeded once via a
# one-time setup step kept outside this repo -- a fixed set has nothing to
# drift-check, so it has no CI job here.
#
# The `unit` job runs the tracker scripts' own pytest suite (offline, no
# secrets) on every PR -- this is the primary safety net, since it also
# covers dump_board.py's GraphQL-extraction logic against a fixture.
#
# The other two jobs each check one project against its live GraphQL
# state, but only when their project var/secret is configured (see
# scripts/tracker/README.md):
#   - `mismatch-drift`: dumps the Mismatches board and diffs it against
#     excludes/ (bidirectional drift).
#   - `soundness-check`: verifies every issue carrying the `soundness`
#     label is actually an item on the Soundness native project (catches
#     the auto-add workflow silently not firing).
# Both no-op ("... not configured; skipping") on fork PRs or before their
# project/secret is set up, rather than failing CI.
name: Tracker drift check

on:
  pull_request:
    paths:
      - "excludes/**"
      - "scripts/tracker/**"
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python3 -m pip install --quiet pytest

      - name: Run tracker unit tests
        run: python3 -m pytest scripts/tracker/ -q

  mismatch-drift:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TRACKER_PAT }}
      PROJECT_NUMBER: ${{ vars.TRACKER_MISMATCH_PROJECT_NUMBER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dump board and check for drift
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$PROJECT_NUMBER" ]; then
            echo "tracker board not configured; skipping"
            exit 0
          fi
          python3 scripts/tracker/dump_board.py "$PROJECT_NUMBER" --owner kaist-plrg --out board.json
          python3 scripts/tracker/tracker_check.py --board board.json

  soundness-check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TRACKER_PAT }}
      PROJECT_NUMBER: ${{ vars.TRACKER_SOUNDNESS_PROJECT_NUMBER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check soundness label membership
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$PROJECT_NUMBER" ]; then
            echo "soundness project not configured; skipping"
            exit 0
          fi
          python3 scripts/tracker/label_check.py --label soundness --project "$PROJECT_NUMBER" --owner kaist-plrg
