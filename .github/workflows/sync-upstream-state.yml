# Periodic sync of the Mismatches board's 'Upstream state' field from each
# item's 'Upstream issue' URL (the related p4lang/p4c or p4lang/p4-spec
# issue/PR). The kaist-plrg P4-SpecTec issue stays the authoritative item
# content; this only annotates each mismatch with its upstream open/closed/
# merged state.
#
# Unlike the read-only drift checks, this WRITES to the board, so it needs a
# separate write-scoped token TRACKER_WRITE_PAT (fine-grained: Projects
# read+write on kaist-plrg, plus public-repo read). It no-ops when the token
# or project number is absent.
name: Sync upstream state

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TRACKER_WRITE_PAT }}
      PROJECT_NUMBER: ${{ vars.TRACKER_MISMATCH_PROJECT_NUMBER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync Upstream state
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$PROJECT_NUMBER" ]; then
            echo "upstream-state sync not configured; skipping"
            exit 0
          fi
          python3 scripts/tracker/sync_upstream_state.py --project "$PROJECT_NUMBER" --owner kaist-plrg
