name: Rust CI

on:
  pull_request:
    branches: [rust-port, main]
  push:
    branches: [rust-port, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Select the pinned Rust toolchain
        working-directory: p4spectec
        run: rustup show

      - name: Cache Rust dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            p4spectec/target
          key: rust-${{ runner.os }}-${{ hashFiles('p4spectec/rust-toolchain.toml', '**/Cargo.lock') }}

      - name: Install native and document dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ruby-dev python3
          sudo gem install asciidoctor asciidoctor-pdf rouge --no-document

      - name: Check formatting and lint
        run: make fmt-check lint

      - name: Build debug, release, and API documentation
        run: make debug build rustdoc

      - name: Run registered E2E acceptance
        run: make -j2 test

      - name: Render P4 HTML specifications
        run: make p4spec-draft-html p4spec-release-html

      - name: Render P4 release PDF
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: make p4spec-release

      - name: Check that acceptance leaves fixtures unchanged
        run: git diff --exit-code -- p4spectec/test-driver excludes testdata patches
