name: Rust tests

on:
  pull_request:
    branches: [rust-port, main]
  push:
    branches: [rust-port, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Select the pinned Rust toolchain
        working-directory: p4spectec
        run: rustup show

      - name: Cache Rust dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            p4spectec/target
          key: rust-${{ runner.os }}-${{ hashFiles('p4spectec/rust-toolchain.toml', '**/Cargo.lock') }}

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Check formatting
        run: make fmt-check

      - name: Run integration tests
        run: make test PROFILE=ci

      - name: Check that acceptance leaves fixtures unchanged
        run: git diff --exit-code -- p4spectec/test-driver excludes testdata patches
