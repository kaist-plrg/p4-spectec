# Profiles of `cargo nextest run`: `make test` uses `default`, CI uses `ci`

[profile.default]
# Run every test after a failure, so that one run shows every failure;
# `ci` inherits this
fail-fast = false

[profile.ci]
# Run the corpora (run.rs, sim.rs) under SL only;
# their AL and PL tests repeat them under other interpreters
default-filter = "not (binary(run) | binary(sim)) | test(_sl)"
