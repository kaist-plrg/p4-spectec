[package]
name = "p4spectec-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[[bin]]
name = "p4spectec"
path = "src/main.rs"
doc = false

[dependencies]
p4spectec = { path = "../core" }
clap = { version = "4.6.6", features = ["derive"] }
indicatif = "0.18.6"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
