[package]
name = "p4spectec-sim"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[dependencies]
p4spectec = { path = "../core" }
lalrpop-util = { version = "0.23.1", default-features = false }
num-bigint = "0.4.6"
num-traits = "0.2.19"
strtoint = "0.1"

[build-dependencies]
lalrpop = { version = "0.23.1", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
