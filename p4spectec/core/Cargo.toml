[package]
name = "p4spectec"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[dependencies]
foldhash = "=0.1.5"
hashbrown = { version = "=0.17.1", default-features = false }
imbl = { version = "7.0.1", default-features = false }
lalrpop-util = { version = "0.23.1", default-features = false }
num-bigint = "0.4.6"
num-traits = "0.2.19"
smallvec = "=1.15.2"
stacker = "0.1.25"
thiserror = "1.0.63"
codespan-reporting = "0.13.1"

[build-dependencies]
lalrpop = { version = "0.23.1", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
