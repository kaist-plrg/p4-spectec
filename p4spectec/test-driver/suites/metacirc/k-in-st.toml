# K definitions run through spec-k and compared with krun: `k-in-st <config>`
# (make test-metacirc-k-in-st).
#
# A configuration selects the `base` of the tower (spec-k is converted by the
# native `algo` pass, so `al`), memoization (`cache`), and determinism checking (`det`).
# Each suite names the K-in-ST tower per base and its definitions: `root`, a
# directory of cases written for spec-k (a .k file, its programs with extension
# `ext`, `prog` if none, and what krun gives for them), or `src`, `dir`, and `def`,
# a definition in the checkout of another repository that the environment variable
# `src` gives, with its `programs` and the directory `expected` of what krun gives
# for them (K_SRC, KWASM_SRC, KEVM_SRC, KMIR_SRC, LLVM_SRC; a suite whose variable
# is not set is skipped). The other options are in test-driver/src/metacirc/k_in_st.rs.
# Running needs K: the definitions are kompiled, and the initial terms made with krun,
# into $CARGO_TARGET_DIR/k-in-st. UPDATE_EXPECT=1 writes what krun gives.
# A configuration with `pending` is skipped without failing until its implementation lands.
# Paths are relative to the repository root.

[[configs]]
name = "sl"
base = "al"
cache = true
det = true

[[suites]]
# Small definitions written to test spec-k: K's behavior where its documentation
# is silent or differs (behavior), failing hooks and functions (errors), and
# features the tutorial languages do not use (features). behavior/or-pattern/left
# ends elsewhere than krun, at another final configuration K allows (left.search).
# Left out are known differences:
# behavior/choice (choice and Set2List differ on ==K-equal collections),
# behavior/fresh-in-function (a fresh value of a rule and of a function it calls
# coincide), and behavior/updatelist-index0 (updateList does not check the bounds
# at index 0)
name = "manual"
towers = { al = "towers/k-in-st.json" }
root = "testdata/k-in-st/manual"

# The languages of the K tutorial, in the checkout of K given by K_SRC
# (runtimeverification/k v7.1.337), with the programs of a quick run of the
# spec-k harness: together they cover what the runs of all their programs cover.
# Their options are those of the tutorial Makefiles.

