# evm-semantics 866e563, with ethereum-tests c30599fb; the KRYPTO plugin is built
# once in the checkout
[[suites]]
name = "kevm"
towers = { al = "towers/k-in-st.json" }
src = "KEVM_SRC"
dir = "kevm-pyk/src/kevm_pyk/kproj/evm-semantics"
def = "driver.md"
kompile = ["--main-module", "ETHEREUM-SIMULATION", "--syntax-module", "ETHEREUM-SIMULATION", "-I", "{src}/kevm-pyk/src/kevm_pyk/kproj/evm-semantics", "-I", "{src}/kevm-pyk/src/kevm_pyk/kproj/plugin", "--md-selector", "k & ! symbolic", "--hook-namespaces", "JSON KRYPTO", "--emit-json", "-O3", "--type-inference-mode", "simplesub", "-ccopt", "-std=c++20", "-ccopt", "-lssl", "-ccopt", "-lcrypto", "-ccopt", "-lsecp256k1", "-ccopt", "{src}/kevm-pyk/src/kevm_pyk/kproj/plugin/build/krypto/lib/krypto.a"]
runtime = ["-std=c++20", "-lssl", "-lcrypto", "-lsecp256k1", "{src}/kevm-pyk/src/kevm_pyk/kproj/plugin/build/krypto/lib/krypto.a"]
init = ["uv", "run", "--project", "{src}/kevm-pyk", "python", "testdata/k-in-st/kevm/init.py", "{program}", "{name}", "{output}"]
programs = [
  "{src}/tests/ethereum-tests/BlockchainTests/GeneralStateTests/VMTests/vmArithmeticTest/arith.json#arith_d0g0v0_Cancun",
  "{src}/tests/ethereum-tests/BlockchainTests/GeneralStateTests/VMTests/vmBitwiseLogicOperation/byte.json#byte_d0g0v0_Cancun",
]
expected = "testdata/k-in-st/kevm"

