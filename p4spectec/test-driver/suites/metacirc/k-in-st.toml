# K definitions run through spec-k and compared with krun: `k-in-st <config>`
# (make test-metacirc-k-in-st).
#
# A configuration selects the `base` of the tower, memoization (`cache`),
# and determinism checking (`det`).
# A suite names its definitions: `root`, a directory of cases written for spec-k,
# or `def` in `dir` of the checkout that the environment variable `src` names
# (a suite whose variable is not set is skipped), with its expectations in
# testdata/k-in-st/<name>; `patch` is applied to a copy of the definition
# first. The layout of a case and the other options are in
# test-driver/src/metacirc/k_in_st/suite.rs.
# Running needs K; KRUN_EXPECT=1 writes what krun gives.
# Paths are relative to the repository root.
#
# The programs of a definition from a checkout are those its project runs on
# the LLVM backend: its test files, but those it leaves out (`skip`), by its own
# lists or, for the K tutorial, in its Makefiles.

[[configs]]
name = "sl"
base = "al"
cache = true
det = true

[[suites]]
name = "manual"
root = "testdata/k-in-st/manual"

# The K tutorial, K v7.1.337
[[suites]]
name = "imp"
src = "K_SRC"
dir = "k-distribution/tests/regression-new/pl-tutorial/1_k/2_imp/lesson_4"
def = "imp.k"
kompile = ["--gen-glr-bison-parser"]
programs = ["tests/*.imp"]

[[suites]]
name = "lambda"
src = "K_SRC"
dir = "k-distribution/tests/regression-new/pl-tutorial/1_k/1_lambda/lesson_8"
def = "lambda.k"
kompile = ["--gen-glr-bison-parser"]
programs = ["tests/*.lambda"]
skip = [
  "tests/arithmetic-div-zero.lambda",  # the tutorial Makefile does not run it
]

[[suites]]
name = "simple"
src = "K_SRC"
dir = "k-distribution/tests/regression-new/pl-tutorial/2_languages/1_simple/1_untyped"
def = "simple-untyped.md"
krun = ["--io", "off"]
programs = ["tests/*/*.simple"]

[[suites]]
name = "kool"
src = "K_SRC"
dir = "k-distribution/tests/regression-new/pl-tutorial/2_languages/2_kool/1_untyped"
def = "kool-untyped.md"
krun = ["--io", "off"]
programs = ["tests/*.kool"]
skip = [
  "tests/threads.kool",  # the tutorial Makefile does not run it
]

[[suites]]
name = "lambda++"
src = "K_SRC"
dir = "k-distribution/tests/regression-new/pl-tutorial/1_k/3_lambda++/lesson_5"
def = "lambda.k"
kompile = ["--syntax-module", "LAMBDA"]
programs = ["tests/*/*.lambda"]

[[suites]]
name = "imp++"
src = "K_SRC"
dir = "k-distribution/tests/regression-new/pl-tutorial/1_k/4_imp++/lesson_7"
def = "imp.k"
kompile = ["--gen-glr-bison-parser"]
krun = ["--io", "off"]
programs = ["tests/*.imp"]

# The tutorial Makefile runs FUN's programs with `--pattern "<k> V:K </k>"`,
# and references-5 with `--search`; the patch keeps the `@` of `@ Exp` out of
# rule labels, which the linker reads as a version mark in a shared library.
[[suites]]
name = "fun"
src = "K_SRC"
dir = "k-distribution/tests/regression-new/pl-tutorial/2_languages/3_fun"
def = "1_untyped/1_environment/fun-untyped.md"
patch = "p4spectec/test-driver/suites/metacirc/k-in-st/fun-untyped.patch"
programs = ["programs/*.fun"]

[[suites]]
name = "simple-typed-static"
src = "K_SRC"
dir = "k-distribution/tests/regression-new/pl-tutorial/2_languages/1_simple/2_typed/1_static"
def = "simple-typed-static.md"
inputs = "tests"
programs = ["../programs/*/*.simple"]

[[suites]]
name = "simple-typed-dynamic"
src = "K_SRC"
dir = "k-distribution/tests/regression-new/pl-tutorial/2_languages/1_simple/2_typed/2_dynamic"
def = "simple-typed-dynamic.md"
inputs = "tests"
krun = ["--io", "off"]
programs = ["../programs/*/*.simple"]
skip = [
  "../programs/diverse/dekker.simple",  # the tutorial Makefile does not run it
  "../programs/threads/threads_03.simple",
  "../programs/threads/threads_08.simple",
  "../programs/threads/threads_05.simple",  # the tutorial Makefile only searches it
]

[[suites]]
name = "kool-typed-dynamic"
src = "K_SRC"
dir = "k-distribution/tests/regression-new/pl-tutorial/2_languages/2_kool/2_typed/1_dynamic"
def = "kool-typed-dynamic.md"
inputs = "tests"
krun = ["--io", "off"]
programs = ["../programs/*.kool"]
skip = [
  "../programs/cycle.kool",  # the tutorial Makefile does not run them
  "../programs/threads.kool",
]

[[suites]]
name = "kool-typed-static"
src = "K_SRC"
dir = "k-distribution/tests/regression-new/pl-tutorial/2_languages/2_kool/2_typed/2_static"
def = "kool-typed-static.md"
inputs = "tests"
krun = ["--io", "off"]
programs = ["../programs/*.kool"]
skip = [
  "../programs/return-object.kool",  # the tutorial Makefile does not run it
]

# wasm-semantics 212271b
[[suites]]
name = "kwasm"
src = "KWASM_SRC"
dir = "pykwasm/src/pykwasm/kdist/wasm-semantics"
def = "test.md"
kompile = [
  "--main-module", "WASM-TEST", "--syntax-module", "WASM-TEST-SYNTAX", "--md-selector", "k",
  "--gen-glr-bison-parser", "-O3",
]
prepare = ["python3", "-I", "{src}/pykwasm/src/pykwasm/scripts/preprocessor.py"]
programs = [
  "{src}/tests/simple/*.wast",
  "{src}/tests/wasm-tests/test/core/*.wast",
]
skip = [
  { list = "{src}/tests/failing.simple", dir = "{src}" },
  { list = "{src}/tests/conformance/unparseable.txt", dir = "{src}/tests/wasm-tests/test/core" },
  { list = "{src}/tests/conformance/unsupported-llvm.txt", dir = "{src}/tests/wasm-tests/test/core" },
]

# evm-semantics 866e563, with ethereum-tests c30599fb; the KRYPTO plugin is built
# once in the checkout
[[suites]]
name = "kevm"
src = "KEVM_SRC"
dir = "kevm-pyk/src/kevm_pyk/kproj/evm-semantics"
def = "driver.md"
kompile = [
  "--main-module", "ETHEREUM-SIMULATION", "--syntax-module", "ETHEREUM-SIMULATION",
  "-I", "{src}/kevm-pyk/src/kevm_pyk/kproj/evm-semantics",
  "-I", "{src}/kevm-pyk/src/kevm_pyk/kproj/plugin", "--md-selector", "k & ! symbolic",
  "--hook-namespaces", "JSON KRYPTO", "--emit-json", "-O3", "--type-inference-mode", "simplesub",
  "-ccopt", "-std=c++20", "-ccopt", "-lssl", "-ccopt", "-lcrypto", "-ccopt", "-lsecp256k1",
  "-ccopt", "{src}/kevm-pyk/src/kevm_pyk/kproj/plugin/build/krypto/lib/krypto.a",
]
runtime = [
  "-std=c++20", "-lssl", "-lcrypto",
  "-lsecp256k1", "{src}/kevm-pyk/src/kevm_pyk/kproj/plugin/build/krypto/lib/krypto.a",
]
init = [
  "uv", "run", "--project", "{src}/kevm-pyk", "python", "testdata/k-in-st/kevm/init.py",
  "{program}", "{test}", "{output}",
]
programs = ["{src}/tests/ethereum-tests/BlockchainTests/GeneralStateTests/VMTests/*/*.json"]
json_tests = true
skip = [
  { list = "{src}/tests/slow.llvm", dir = "{src}/tests/ethereum-tests" },
  { list = "{src}/tests/failing.llvm", dir = "{src}/tests/ethereum-tests" },
]

# mir-semantics 4d79325
[[suites]]
name = "kmir"
src = "KMIR_SRC"
dir = "kmir/src/kmir/kdist/mir-semantics"
def = "kmir.md"
kompile = [
  "-I", "{src}/kmir/src/kmir/kdist", "--syntax-module", "KMIR-AST",
  "--md-selector", "k & ! symbolic", "-O2", "-w2e", "--emit-json",
]
init = [
  "uv", "run", "--project", "{src}/kmir", "python", "testdata/k-in-st/kmir/init.py", "{kompiled}",
  "{program}", "{output}",
]
programs = [
  "{src}/kmir/src/tests/integration/data/exec-smir/*/*.smir.json",
  "{src}/kmir/src/tests/integration/data/run-rs/*/*.rs",
  "{src}/kmir/src/tests/integration/data/ub/*.rs",
]
