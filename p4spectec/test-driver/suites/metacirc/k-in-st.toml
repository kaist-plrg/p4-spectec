# K definitions run through spec-k and compared with krun: `k-in-st <config>`
# (make test-metacirc-k-in-st).
#
# A configuration selects the `base` of the tower, memoization (`cache`),
# and determinism checking (`det`).
# A suite names its definitions: `root`, a directory of cases written for spec-k,
# or `def` in `dir` of the checkout that the environment variable `src` names
# (a suite whose variable is not set is skipped). The layout of a case and the
# other options are in test-driver/src/metacirc/k_in_st/suite.rs.
# Running needs K; KRUN_EXPECT=1 writes what krun gives.
# Paths are relative to the repository root.

[[configs]]
name = "sl"
base = "al"
cache = true
det = true

# Left out, as known differences from krun: behavior/choice,
# behavior/fresh-in-function, behavior/updatelist-index0
[[suites]]
name = "manual"
towers = { al = "towers/k-in-st.json" }
root = "testdata/k-in-st/manual"

