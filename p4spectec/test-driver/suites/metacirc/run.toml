# Corpus runs through metacircular towers: `run <config>`
# (make test-metacirc-run-al, test-metacirc-run-il, test-metacirc-micro-al, test-metacirc-micro-il).
#
# A configuration selects the `base` language of the towers it runs,
# memoization (`cache`), and determinism checking (`det`).
# Base "al" converts the specifications and AL inputs with the native `algo` pass;
# base "il" enters the base level through `Eval_IL`,
# so `Algo_IL` of the meta specification converts its IL input.
# Each suite names one tower per base; a suite without a tower for the base is skipped.
# The tower's top level decides the entry relation and the inputs:
# a P4 suite records pass, fail, or exclude per .p4 file under `root` in `expected`,
# which every configuration shares;
# a script suite expects every .watsup script under `root` to end with `outcome`.
# `excludes` lists, per base, directories of .exclude files naming skipped sources.
# Paths are relative to the repository root.

includes = ["p4c/p4include"]
excludes = { al = ["excludes/static"], il = ["excludes/static", "excludes/metacirc-meta"] }

[[configs]]
name = "al"
base = "al"
cache = true
det = true

[[configs]]
name = "il"
base = "il"
cache = true
det = true

[[suites]]
name = "run-positive"
towers = { al = "towers/al-p4.json", il = "towers/il-p4.json" }
root = "p4c/testdata/p4_16_samples"
expected = "p4spectec/test-driver/expected/run/pos.expected"

[[suites]]
name = "run-negative"
towers = { al = "towers/al-p4-ok.json", il = "towers/il-p4-ok.json" }
root = "p4c/testdata/p4_16_errors"
expected = "p4spectec/test-driver/expected/run/neg.expected"

[[suites]]
name = "regression-positive"
towers = { al = "towers/al-p4.json", il = "towers/il-p4.json" }
root = "testdata/regression/pos"
expected = "p4spectec/test-driver/expected/run/regression-pos.expected"

[[suites]]
name = "regression-negative"
towers = { al = "towers/al-p4-ok.json", il = "towers/il-p4-ok.json" }
root = "testdata/regression/neg"
expected = "p4spectec/test-driver/expected/run/regression-neg.expected"

[[suites]]
name = "pos-run"
towers = { al = "towers/al.json", il = "towers/il.json" }
root = "testdata/spec/pos/run"
outcome = "success"

[[suites]]
name = "neg-run"
towers = { al = "towers/al.json", il = "towers/il.json" }
root = "testdata/spec/neg/run"
outcome = "failure"

[[suites]]
name = "neg-algo"
towers = { il = "towers/il.json" }
root = "testdata/spec/neg/algo"
outcome = "failure"
