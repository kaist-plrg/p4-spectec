# Meta codec round trips: `metaparse` (make test-metacirc-metaparse).
#
# Each suite elaborates and converts its `spec` sources, then requires the IL
# and AL meta encodings to be fixed points of decode-then-encode.
# Paths are relative to the repository root.

[[suites]]
name = "spec"
spec = ["spec"]

[[suites]]
name = "spec-meta"
spec = ["spec-meta"]
