# Meta specification snapshots: `elab`, `algo`, `structure`, and `prose`
# (make test-metacirc-elab, ...), each checking the snapshots of its stage.
#
# Registered as in `suites/snapshot.toml`, for the sources in `spec-meta`.
# `make test-metacirc-promote` rewrites every expected file here.
# Paths are relative to the repository root.

[[snapshots]]
name = "elab"
spec = ["spec-meta"]
stage = "elab"
expected = "p4spectec/test-driver/expected/spec-meta/elab.expected"

[[snapshots]]
name = "algo"
spec = ["spec-meta"]
stage = "algo"
expected = "p4spectec/test-driver/expected/spec-meta/algo.expected"

[[snapshots]]
name = "structure-without-rule-groups"
spec = ["spec-meta"]
stage = "structure"
without_rule_groups = true
expected = "p4spectec/test-driver/expected/spec-meta/structure-without-rule-groups.expected"

[[snapshots]]
name = "structure-with-rule-groups"
spec = ["spec-meta"]
stage = "structure"
without_rule_groups = false
expected = "p4spectec/test-driver/expected/spec-meta/structure-with-rule-groups.expected"

[[snapshots]]
name = "prose"
spec = ["spec-meta"]
stage = "prose"
expected = "p4spectec/test-driver/expected/spec-meta/prose.expected"
