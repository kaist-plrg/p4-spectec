# P4 execution of every .p4 file under `root` through `relation`,
# compared with `expected/run/<name>.expected`

excludes = ["excludes/static"]

[[configs]]
name = "al"
language = "al"
cache = true
det = true

[[configs]]
name = "sl"
language = "sl"
cache = true
det = true

[[configs]]
name = "pl"
language = "pl"
cache = true
det = true

[[suites]]
name = "pos"
root = "p4c/testdata/p4_16_samples"
relation = "Program_inst"

[[suites]]
name = "neg"
root = "p4c/testdata/p4_16_errors"
relation = "Program_ok"

[[suites]]
name = "regression-pos"
root = "testdata/regression/pos"
relation = "Program_inst"

[[suites]]
name = "regression-neg"
root = "testdata/regression/neg"
relation = "Program_ok"
