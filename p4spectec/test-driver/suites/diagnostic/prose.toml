cases = [
  { name = "hint-prose-fields-arity", input = "neg/prose/hint-prose-fields-arity.watsup", expected = "neg/prose/hint-prose-fields-arity.expect" },
  { name = "hint-prose-fields-shape", input = "neg/prose/hint-prose-fields-shape.watsup", expected = "neg/prose/hint-prose-fields-shape.expect" },
  { name = "hint-prose-index-out-of-range", input = "neg/prose/hint-prose-index-out-of-range.watsup", expected = "neg/prose/hint-prose-index-out-of-range.expect" },
]
