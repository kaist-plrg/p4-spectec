# Prose conversion diagnostics: `diagnostics --suite prose`.
# Each input must convert to SL, then fail prose conversion.
#
# Paths in cases are relative to `root`, the working directory while they run.
# Each case renders its reports and compares the text with `expected`;
# `make test-diagnostics-promote` rewrites the expected files.

root = "testdata/spec"

[[cases]]
name = "hint-prose-fields-arity"
input = "neg/prose/hint-prose-fields-arity.watsup"
expected = "neg/prose/hint-prose-fields-arity.expect"

[[cases]]
name = "hint-prose-fields-shape"
input = "neg/prose/hint-prose-fields-shape.watsup"
expected = "neg/prose/hint-prose-fields-shape.expect"

[[cases]]
name = "hint-prose-index-out-of-range"
input = "neg/prose/hint-prose-index-out-of-range.watsup"
expected = "neg/prose/hint-prose-index-out-of-range.expect"
