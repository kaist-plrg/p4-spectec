# Command-line diagnostics: `diagnostics --suite command`.
#
# Paths in cases are relative to `root`, the working directory while they run.
# Each `.args` input runs the product CLI with one argument per line,
# copying `inputs` into a temporary directory, and compares its stderr,
# which must contain `code`; `outcome` is the expected exit status.
# `make test-diagnostics-promote` rewrites the expected files.

root = "testdata/spec"

cases = [
  { name = "command-splice-file-count-mismatch", input = "cli/command/command-splice-file-count-mismatch.args", expected = "cli/command/command-splice-file-count-mismatch.expect", code = "command/splice-file-count-mismatch" },
  { name = "command-splice-output-conflict", input = "cli/command/command-splice-output-conflict.args", expected = "cli/command/command-splice-output-conflict.expect", code = "command/splice-output-conflict" },
  { name = "command-splice-input-required", input = "cli/command/command-splice-input-required.args", expected = "cli/command/command-splice-input-required.expect", code = "command/splice-input-required" },
  { name = "splice-conflict-before-input", input = "cli/command/splice-conflict-before-input.args", expected = "cli/command/splice-conflict-before-input.expect", code = "command/splice-output-conflict" },
  { name = "splice-input-required-inplace", input = "cli/command/splice-input-required-inplace.args", expected = "cli/command/splice-input-required-inplace.expect", code = "command/splice-input-required" },
  { name = "splice-input-required-output", input = "cli/command/splice-input-required-output.args", expected = "cli/command/splice-input-required-output.expect", code = "command/splice-input-required" },
  { name = "splice-more-outputs", input = "cli/command/splice-more-outputs.args", expected = "cli/command/splice-more-outputs.expect", code = "command/splice-file-count-mismatch" },
  { name = "splice-no-output", input = "cli/command/splice-no-output.args", expected = "cli/command/splice-no-output.expect", code = "command/splice-file-count-mismatch" },
]
