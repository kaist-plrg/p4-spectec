# Algorithmic conversion diagnostics: `diagnostics --suite algo`.
# Each input must parse and elaborate, then fail AL conversion.
#
# Paths in cases are relative to `root`, the working directory while they run.
# Each case renders its reports and compares the text with `expected`;
# `make test-diagnostics-promote` rewrites the expected files.

root = "testdata/spec"

[[cases]]
name = "dataflow-bind-both-sides-of-equality"
input = "neg/algo/dataflow-bind-both-sides-of-equality.watsup"
