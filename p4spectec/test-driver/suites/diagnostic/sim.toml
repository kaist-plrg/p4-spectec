# Simulator diagnostics: `diagnostics --suite sim`.
# A .watsup input with `arch` must convert to AL and fail simulator admission.
# A .p4 input with `inputs` = [specification, include directory]
# must fail `relation` with a report containing `code`.
#
# Paths in cases are relative to `root`, the working directory while they run.
# Each case renders its reports and compares the text with `expected`;
# `make test-diagnostics-promote` rewrites the expected files.
# An `.args` input instead runs the product CLI with one argument per line,
# copying `inputs` into a temporary directory, and compares its stderr,
# which must contain `code`; `outcome` is the expected exit status.

root = "testdata/spec"

cases = [
  { name = "sim-unsupported-architecture", input = "cli/sim/sim-unsupported-architecture.watsup", expected = "cli/sim/sim-unsupported-architecture.expect", arch = "unsupported" },
  { name = "static-assert-false-custom", input = "cli/sim/static-assert-false-custom.p4", expected = "cli/sim/static-assert-false-custom.expect", inputs = ["../../spec", "../../p4c/p4include"], relation = "Program_ok", code = "sim/assertion-unmet" },
  { name = "static-assert-false-default", input = "cli/sim/static-assert-false-default.p4", expected = "cli/sim/static-assert-false-default.expect", inputs = ["../../spec", "../../p4c/p4include"], relation = "Program_ok", code = "sim/assertion-unmet" },
  { name = "sim-al-syntax", input = "cli/sim/sim-al-syntax.args", expected = "cli/sim/sim-syntax.expect", code = "p4/syntax-invalid" },
  { name = "sim-al-undefined-relation", input = "cli/sim/sim-al-undefined-relation.args", expected = "cli/sim/sim-undefined-relation.expect", code = "runtime/binding-undefined" },
  { name = "sim-sl-syntax", input = "cli/sim/sim-sl-syntax.args", expected = "cli/sim/sim-syntax.expect", code = "p4/syntax-invalid" },
  { name = "sim-sl-undefined-relation", input = "cli/sim/sim-sl-undefined-relation.args", expected = "cli/sim/sim-undefined-relation.expect", code = "runtime/binding-undefined" },
  { name = "sim-pl-syntax", input = "cli/sim/sim-pl-syntax.args", expected = "cli/sim/sim-syntax.expect", code = "p4/syntax-invalid" },
  { name = "sim-pl-undefined-relation", input = "cli/sim/sim-pl-undefined-relation.args", expected = "cli/sim/sim-undefined-relation.expect", code = "runtime/binding-undefined" },
  { name = "sim-prior-matches-before-packet-mismatch", input = "cli/sim/stf-packet-mismatch.args", expected = "cli/sim/stf-packet-mismatch.expect", code = "sim/packet-mismatch" },
]
