# Interpreter diagnostics: `diagnostics --suite interp`.
# A .p4 input must fail the P4 parser with a syntax error.
# A .watsup input is converted to each language in `languages`;
# applying `relation` to the natural numbers `nats` must fail
# with `kind` ("fatal" or "mismatch") and a report containing `code`.
# `languages` runs the case once per language, named `<name>-<language>`;
# `det` enables determinism checking (default false).
#
# Paths in cases are relative to `root`, the working directory while they run.
# Each case renders its reports and compares the text with `expected`;
# `make test-diagnostics-promote` rewrites the expected files.

root = "testdata/spec"

[[cases]]
name = "p4-syntax"
input = "p4/p4-syntax.p4"
expected = "p4/p4-syntax.expect"

[[cases]]
name = "p4-source-line-overflow"
input = "p4/p4-source-line-overflow.p4"
expected = "p4/p4-source-line-overflow.expect"

[[cases]]
name = "p4-source-newline-overflow"
input = "p4/p4-source-newline-overflow.p4"
expected = "p4/p4-source-newline-overflow.expect"

[[cases]]
name = "backtrack"
input = "neg/run-rel/backtrack.watsup"
expected = "neg/run-rel/backtrack.expect"
relation = "R"
nats = [1]
languages = ["al", "sl", "pl"]
kind = "mismatch"
code = "runtime/condition-unmet"

