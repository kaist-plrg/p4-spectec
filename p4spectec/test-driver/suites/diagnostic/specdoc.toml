# AsciiDoc rendering diagnostics: `diagnostics --suite specdoc`.
# Each input must convert to PL without warnings,
# then render with `adoc/` warnings located in the input.
#
# Paths are relative to `testdata/spec`. Each case renders its reports
# and compares the text with `expected`;
# `make test-diagnostics-promote` rewrites the expected files.

cases = [
  { name = "adoc-nested-link", input = "neg/specdoc/adoc-nested-link.watsup", expected = "neg/specdoc/adoc-nested-link.expect" },
  { name = "adoc-empty-body", input = "neg/specdoc/adoc-empty-body.watsup", expected = "neg/specdoc/adoc-empty-body.expect" },
  { name = "adoc-invalid-text", input = "neg/specdoc/adoc-invalid-text.watsup", expected = "neg/specdoc/adoc-invalid-text.expect" },
]
