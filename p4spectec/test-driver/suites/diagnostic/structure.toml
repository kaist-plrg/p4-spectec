# Structuring diagnostics: `diagnostics --suite structure`.
# Each input must convert to AL, then fail structuring;
# `without_rule_groups` selects the rule-group mode (default false).
#
# Paths are relative to `testdata/spec`. Each case renders its reports
# and compares the text with `expected`;
# `make test-diagnostics-promote` rewrites the expected files.

cases = [
  { name = "generic-subtype", input = "neg/structure/generic-subtype.watsup", expected = "neg/structure/generic-subtype.expect" },
  { name = "generic-subtype-without-rule-groups", input = "neg/structure/generic-subtype.watsup", expected = "neg/structure/generic-subtype.expect", without_rule_groups = true },
]
