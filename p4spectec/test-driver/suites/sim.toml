# STF simulation of P4 programs under `p4` paired with tests under `stf`,
# compared with `expected/sim/<name>.expected`;
# `patches` replaces files with the same stem

spec = ["spec"]
includes = ["p4c/p4include"]
excludes = ["excludes/static", "excludes/dynamic"]

[[configs]]
name = "al"
language = "al"
cache = true
det = true

[[configs]]
name = "sl"
language = "sl"
cache = true
det = true

[[configs]]
name = "pl"
language = "pl"
cache = true
det = true

[[suites]]
name = "v1model-p4c"
arch = "v1model"
p4 = "p4c/testdata/p4_16_samples"
stf = "p4c/testdata/p4_16_samples"
patches = "patches/v1model"

[[suites]]
name = "v1model-p4testgen"
arch = "v1model"
p4 = "p4c/testdata/p4_16_samples"
stf = "testdata/p4testgen"
patches = "patches/v1model"

[[suites]]
name = "v1model-custom"
arch = "v1model"
p4 = "testdata/custom"
stf = "testdata/custom"
patches = "patches/v1model"

[[suites]]
name = "ebpf-p4c"
arch = "ebpf"
p4 = "p4c/testdata/p4_16_samples"
stf = "p4c/testdata/p4_16_samples"

[[suites]]
name = "ebpf-p4testgen"
arch = "ebpf"
p4 = "p4c/testdata/p4_16_samples"
stf = "testdata/p4testgen"

[[suites]]
name = "psa-p4c"
arch = "psa"
p4 = "p4c/testdata/p4_16_samples"
stf = "p4c/testdata/p4_16_samples"

[[suites]]
name = "v1model-regression"
arch = "v1model"
p4 = "testdata/regression/sim"
stf = "testdata/regression/sim"

[[suites]]
name = "ebpf-regression"
arch = "ebpf"
p4 = "testdata/regression/sim"
stf = "testdata/regression/sim"
