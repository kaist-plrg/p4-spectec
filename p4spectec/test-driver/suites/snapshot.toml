# Specification snapshots: `elab`, `algo`, `structure`, `prose`, and `adoc`
# (make test-elab, ...), each checking the snapshots of its stages.
#
# Each snapshot converts `spec` to its `stage` and compares the printed text
# with `expected/snapshot/<name>.expected`; trailing spaces are ignored.
# `without_rule_groups` selects the structure rule-group mode.
# "adoc-el" and "adoc-pl" render AsciiDoc, and "adoc-pl" also requires
# repeated rendering to produce the same anchors.
# `make promote` rewrites the elab, algo, prose, and adoc expected files.
# Paths are relative to the repository root.

spec = ["spec"]

[[snapshots]]
name = "elab"
stage = "elab"

[[snapshots]]
name = "algo"
stage = "algo"

[[snapshots]]
name = "structure-without-rule-groups"
stage = "structure"
without_rule_groups = true

[[snapshots]]
name = "structure-with-rule-groups"
stage = "structure"
without_rule_groups = false

[[snapshots]]
name = "prose"
stage = "prose"

[[snapshots]]
name = "adoc-el"
stage = "adoc-el"

[[snapshots]]
name = "adoc-pl"
stage = "adoc-pl"
