# Specification snapshots: `elab`, `algo`, `structure`, `prose`, and `adoc`
# (make test-elab, ...), each checking the snapshots of its stages.
#
# Each snapshot converts its `spec` sources to its `stage`
# and compares the printed text with `expected`; trailing spaces are ignored.
# `without_rule_groups` selects the structure rule-group mode.
# "adoc-el" and "adoc-pl" render AsciiDoc, and "adoc-pl" also requires
# repeated rendering to produce the same anchors.
# `make promote` rewrites the elab, algo, prose, and adoc expected files.
# Paths are relative to the repository root.

[[snapshots]]
name = "elab"
spec = ["spec"]
stage = "elab"
expected = "p4spectec/test-driver/expected/snapshot/elab.expected"

[[snapshots]]
name = "algo"
spec = ["spec"]
stage = "algo"
expected = "p4spectec/test-driver/expected/snapshot/algo.expected"

[[snapshots]]
name = "structure-without-rule-groups"
spec = ["spec"]
stage = "structure"
without_rule_groups = true
expected = "p4spectec/test-driver/expected/snapshot/structure-without-rule-groups.expected"

[[snapshots]]
name = "structure-with-rule-groups"
spec = ["spec"]
stage = "structure"
without_rule_groups = false
expected = "p4spectec/test-driver/expected/snapshot/structure-with-rule-groups.expected"

[[snapshots]]
name = "prose"
spec = ["spec"]
stage = "prose"
expected = "p4spectec/test-driver/expected/snapshot/prose.expected"

[[snapshots]]
name = "adoc-el"
spec = ["spec"]
stage = "adoc-el"
expected = "p4spectec/test-driver/expected/snapshot/adoc-el.expected"

[[snapshots]]
name = "adoc-pl"
spec = ["spec"]
stage = "adoc-pl"
expected = "p4spectec/test-driver/expected/snapshot/adoc-pl.expected"
