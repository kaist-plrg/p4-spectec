[package]
name = "p4spectec-test"
version.workspace = true
edition.workspace = true
default-run = "p4spectec-test"
rust-version.workspace = true

[[bin]]
name = "p4spectec-test"
path = "src/bin/main.rs"

[dependencies]
p4spectec = { path = "../core" }
p4spectec-sim = { path = "../sim" }
clap = { version = "4.6.6", features = ["derive"] }
expect-test = "1.5.1"
indicatif = "0.18.6"
serde = { version = "1.0.210", features = ["derive"] }
tempfile = "3.27.0"
rustix = { version = "1.1.5", features = ["stdio"] }
toml = "0.9.12"

[lints]
workspace = true
