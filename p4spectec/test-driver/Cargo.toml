[package]
name = "p4spectec-test"
version = "0.1.0"
edition = "2024"
default-run = "p4spectec-test"
rust-version = "1.97.1"

[[bin]]
name = "p4spectec-test"
path = "src/bin/main.rs"

[[bin]]
name = "metacirc-test"
path = "src/bin/metacirc.rs"

[dependencies]
p4spectec = { path = ".." }
clap = { version = "4.6.6", features = ["derive"] }
expect-test = "1.5.1"
indicatif = "0.18.6"
serde = { version = "1.0.210", features = ["derive"] }
tempfile = "3.27.0"
rustix = { version = "1.1.5", features = ["stdio"] }
toml = "0.9.12"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
