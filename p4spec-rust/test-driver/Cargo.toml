[package]
name = "p4spec-test-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[dependencies]
p4spec-rust = { path = ".." }
clap = { version = "4.6.6", features = ["derive"] }
thiserror = "1.0.63"
expect-test = "1.5.1"
indicatif = "0.18.6"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
