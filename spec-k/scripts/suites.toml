# Formatted with: uvx taplo fmt -o align_comments=false -o column_width=100
#
# The test suites of ktest.py: K definitions whose programs are run by krun
# and by the K spec, and compared (difftest.py). When the final configuration
# or the step count differs, the run of the spec is checked step by step: each
# step must be one K allows (K leaves the choice among rules of the same
# priority and the order of map elements open).
#
# A quick run (the default) leaves out the programs marked long; a full run
# (ktest.py --full) runs them too. Programs marked skip never run.
#
# [suite.<name>], run in this order by default:
#   src          where dir is: "k" (K v7.1.337), "kwasm" (wasm-semantics),
#                "kevm" (evm-semantics), or "spec" (this repository)
#   dir, def     the directory of the definition, and its file
#   ext          the extension of the programs
#   tests        directories of the programs, relative to dir (default ["tests"])
#   inputs       directory of the <program>.in files, relative to dir
#                (default: beside the programs)
#   kompile      extra kompile options (--enable-search is always added)
#   krun         extra krun options
#   depth        stop krun and the spec after this many steps
#   kompiled_as  use the kompiled definition of that suite
#   timeout      seconds for each run of the spec (default 3600)
#   cache_size   entries of the executor's call cache (SPECTEC_CACHE_SIZE;
#                default 32768); fewer bound the memory of large configurations
#   kore_input   the programs are initial terms in KORE (kevm: made from
#                the GeneralStateTests in gst, with mode and schedule)
#   quick_per_file  in a quick run, only this many programs of each
#                <file>-<test> group
#   long         programs (glob patterns) left out of a quick run: those whose
#                spec run takes more than five minutes
#   skip         programs (glob patterns) never run, with why in comments
#
# The tutorial languages leave out the programs that the tutorial Makefiles do
# not run.

[suite.imp]
src = "k"
dir = "k-distribution/tests/regression-new/pl-tutorial/1_k/2_imp/lesson_4"
def = "imp.k"
ext = "imp"
kompile = ["--gen-glr-bison-parser"]

[suite.lambda]
src = "k"
dir = "k-distribution/tests/regression-new/pl-tutorial/1_k/1_lambda/lesson_8"
def = "lambda.k"
ext = "lambda"
kompile = ["--gen-glr-bison-parser"]

[suite.simple]
src = "k"
dir = "k-distribution/tests/regression-new/pl-tutorial/2_languages/1_simple/1_untyped"
def = "simple-untyped.md"
ext = "simple"
krun = ["--io", "off"]
tests = ["tests/diverse", "tests/exceptions", "tests/threads"]
skip = ["threads_05.simple"] # krun's run does not end

[suite.kool]
src = "k"
dir = "k-distribution/tests/regression-new/pl-tutorial/2_languages/2_kool/1_untyped"
def = "kool-untyped.md"
ext = "kool"
krun = ["--io", "off"]
skip = ["threads.kool"] # the tutorial Makefile does not run it

[suite."lambda++"]
src = "k"
dir = "k-distribution/tests/regression-new/pl-tutorial/1_k/3_lambda++/lesson_5"
def = "lambda.k"
ext = "lambda"
kompile = ["--syntax-module", "LAMBDA"]
tests = ["tests/deterministic", "tests/nondeterministic"]

# The proofs of the lesson (kprove, the Haskell backend) are not run
[suite."imp++"]
src = "k"
dir = "k-distribution/tests/regression-new/pl-tutorial/1_k/4_imp++/lesson_7"
def = "imp.k"
ext = "imp"
kompile = ["--gen-glr-bison-parser"]
krun = ["--io", "off"]

[suite.simple-typed-static]
src = "k"
dir = "k-distribution/tests/regression-new/pl-tutorial/2_languages/1_simple/2_typed/1_static"
def = "simple-typed-static.md"
ext = "simple"
tests = ["../programs/diverse", "../programs/exceptions", "../programs/threads"]
inputs = "tests"

[suite.simple-typed-dynamic]
src = "k"
dir = "k-distribution/tests/regression-new/pl-tutorial/2_languages/1_simple/2_typed/2_dynamic"
def = "simple-typed-dynamic.md"
ext = "simple"
krun = ["--io", "off"]
tests = ["../programs/diverse", "../programs/exceptions", "../programs/threads"]
inputs = "tests"
long = ["matrix.simple"]
skip = [
  # krun's run does not end
  "threads_05.simple",
  # they do not end, and the tutorial Makefile does not run them
  "dekker.simple",
  "threads_03.simple",
  "threads_08.simple",
]

[suite.kool-typed-dynamic]
src = "k"
dir = "k-distribution/tests/regression-new/pl-tutorial/2_languages/2_kool/2_typed/1_dynamic"
def = "kool-typed-dynamic.md"
ext = "kool"
krun = ["--io", "off"]
tests = ["../programs"]
inputs = "tests"
long = ["matrix.kool"]
skip = ["cycle.kool", "threads.kool"] # the tutorial Makefile does not run them

[suite.kool-typed-static]
src = "k"
dir = "k-distribution/tests/regression-new/pl-tutorial/2_languages/2_kool/2_typed/2_static"
def = "kool-typed-static.md"
ext = "kool"
krun = ["--io", "off"]
tests = ["../programs"]
inputs = "tests"
skip = ["return-object.kool"] # the tutorial Makefile does not run it

[suite.fun]
src = "k"
dir = "k-distribution/tests/regression-new/pl-tutorial/2_languages/3_fun/1_untyped/1_environment"
def = "fun-untyped.md"
ext = "fun"
# constructor-bst-sorting grows the store to 1,131 entries (a 1 MB
# configuration): a smaller call cache keeps the spec under its memory limit,
# and its 13,914 steps take about 66 minutes step by step
cache_size = 1024
timeout = 7200
tests = ["../../programs"]
inputs = "tests"
long = ["constructor-bst-sorting.fun"]

[suite.kwasm]
src = "kwasm"
dir = "pykwasm/src/pykwasm/kdist/wasm-semantics"
def = "test.md"
ext = "wast"
kompile = [
  "--main-module",
  "WASM-TEST",
  "--syntax-module",
  "WASM-TEST-SYNTAX",
  "--md-selector",
  "k",
  "--gen-glr-bison-parser",
  "-O3",
]
timeout = 7200
long = [
  "conformance-f32_cmp.wast",
  "conformance-f64_cmp.wast",
  "conformance-names.wast",
  "conformance-table_copy.wast",
  "conformance-table_init.wast",
  "conformance-memory_copy.wast",
  "conformance-memory_fill.wast",
  "conformance-memory_grow.wast",
  "conformance-call.wast",
]

# KEVM: the VMTests of ethereum-tests, as kevm-pyk run makes their initial
# terms (VMTESTS mode, default schedule), with the blockchain plugin built in
# the plugin directory (make). A quick run takes the first test of each file
[suite.kevm]
src = "kevm"
dir = "kevm-pyk/src/kevm_pyk/kproj/evm-semantics"
def = "driver.md"
ext = "kore"
kore_input = true
gst = "tests/ethereum-tests/BlockchainTests/GeneralStateTests/VMTests"
quick_per_file = 1
mode = "VMTESTS"
schedule = "DEFAULT"
# twoOps (51,547 steps) needs 1.3 GB with 4,096 entries, and more than 2.5 GB
# with the default
cache_size = 4096
kompile = [
  "--main-module",
  "ETHEREUM-SIMULATION",
  "--syntax-module",
  "ETHEREUM-SIMULATION",
  "-I",
  "{src}/kevm-pyk/src/kevm_pyk/kproj/evm-semantics",
  "-I",
  "{src}/kevm-pyk/src/kevm_pyk/kproj/plugin",
  "--md-selector",
  "k & ! symbolic",
  "--hook-namespaces",
  "JSON KRYPTO",
  "--emit-json",
  "-O3",
  "--type-inference-mode",
  "simplesub",
  "-ccopt",
  "-std=c++20",
  "-ccopt",
  "-lssl",
  "-ccopt",
  "-lcrypto",
  "-ccopt",
  "-lsecp256k1",
  "-ccopt",
  "{src}/kevm-pyk/src/kevm_pyk/kproj/plugin/build/krypto/lib/krypto.a",
]
long = ["vmPerformance-*"]

# IMP stopped after 20 steps
[suite.depth]
src = "k"
dir = "k-distribution/tests/regression-new/pl-tutorial/1_k/2_imp/lesson_4"
def = "imp.k"
ext = "imp"
kompiled_as = "imp"
depth = 20

# Definitions written for the K features and errors that the languages above
# do not exercise, with their programs in tests/

[suite.priority]
src = "spec"
dir = "spec-k/test/priority"
def = "priority.k"
ext = "priority"

[suite.equality]
src = "spec"
dir = "spec-k/test/equality"
def = "equality.k"
ext = "equality"

# mint.k cannot have a module MINT, which K's domains.md has
[suite.mint]
src = "spec"
dir = "spec-k/test/mint"
def = "mint.k"
ext = "mint"
kompile = ["--main-module", "MINT-TEST", "--syntax-module", "MINT-TEST"]

[suite.binder]
src = "spec"
dir = "spec-k/test/binder"
def = "binder.k"
ext = "binder"

[suite.errors]
src = "spec"
dir = "spec-k/test/errors"
def = "errors.k"
ext = "errors"

# The regression tests of K (in dir) that kompile with the LLVM backend and
# krun their programs through ktest.mak, with the settings of their Makefiles.
# Those run with --search are checked step by step, with the --depth of the
# Makefile as the step limit.
[regression]
dir = "k-distribution/tests/regression-new"
# tests (or <test>/<program>) not run
skip = [
  # they krun differently from a plain run of each program:
  # krun --proof-hint
  "proof-instrumentation",
  "proof-instrumentation-debug",
  # krun --dry-run
  "issue-1602",
  # a custom parser
  "krun-deserialize",
  "issue-582",
  "star-multiplicity",
  # a preprocessed definition
  "issue-1169",
  # a definition in JSON
  "imp-outer-json",
  # kast tests
  "issue-2273",
  # a custom krun target
  "issue-946",
  # they use what the spec does not cover:
  # file IO, random numbers, the exit code, #trace (IO), #unparseKORE (reflection)
  "io-llvm",
  "rand",
  "exit-code-no-gen-top",
  "trace",
  "unparseKORE",
  # the initializers take the configuration as an argument (fresh variables
  # in the configuration), but krun's initial term does not pass it
  "issue-3520-freshConfig",
  # kompile leaves a fresh variable of a function equation unbound
  "withConfig2/1.test",
]

# krun options in place of those of the Makefile
[regression.krun]
# its own script passes $MODE; print would write to stdout (IO)
parseNonPgm = ["-cMODE=noprint"]

# The tests of the LLVM backend (llvm-backend f02284f, test/defn/<name>.kore)
# that run its interpreter on initial terms in KORE (test/input), compared
# with the interpreter llvm-kompile builds from the same definition. long and
# skip name tests, or <test>/<program>
[llvm]
long = ["migrate-map-root", "imp-with-rangemaps", "test-gc-stringbuffer"]
skip = [
  # file IO (the interpreter writes files in the working directory)
  "io",
  "test26",
  "test28",
  # an older kompile's KORE: rule sides as ruleNLHS aliases with \equals and
  # \top, owise as \not(priorityLE50())
  "issue-539-priorities",
  "kool-static",
  "locations",
  "sk",
  "test8",
  "test33",
  # a fresh variable left unbound in a function equation, as withConfig2/1.test
  "test18",
  # FFI hooks (native memory and calls)
  "test21",
  # JSON hooks, not in the spec yet
  "test34",
  # a function recursing 2^19 deep in one step: the LLVM backend makes it a
  # tail call, the spec nests it (about 12 KB a level)
  "iterated-map-pointer-residual",
]
